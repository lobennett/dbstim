[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dbstim"
dynamic = ["version"]
description = "Platform-independent Digital Brain Python API client"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
jupyter = ["jupyterlab>=4,<5"]

[project.urls]
Repository = "https://github.com/lobennett/dbstim"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dbstim*"]

[tool.setuptools.dynamic]
version = {attr = "dbstim.__version__"}

[tool.setuptools.package-data]
dbstim = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
